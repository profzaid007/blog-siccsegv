baseURL = 'https://blog.siccsegv.com/'
locale = 'en-us'
title = 'Siccsegv Blog'

[params]
  description = 'Insights into technology, cybersecurity, philosophy and all that lies in between'
  tagline = '// Technical Insights & Security Research'
  mainSite = 'https://siccsegv.com'
  postsPerPage = 6
  author = 'Siccsegv Team'
  authorRole = 'Security Researchers'
  authorBio = 'Security practitioners sharing technical insights and real-world experiences from the trenches of penetration testing and security research.'

[taxonomies]
  category = 'categories'
  tag = 'tags'

[related]
  includeNewer = true
  threshold = 80
  toLower = false
  [[related.indices]]
    name = 'categories'
    weight = 100
  [[related.indices]]
    name = 'tags'
    weight = 80
  [[related.indices]]
    name = 'date'
    weight = 10

[markup]
  [markup.goldmark]
    # Existing posts use raw HTML in a few places.
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      autoHeadingID = true
      # Enables {.class} attributes on block elements.
      [markup.goldmark.parser.attribute]
        block = true
  # Emit Chroma classes; colours live in static/css/chroma.css.
  [markup.highlight]
    noClasses = false
    lineNos = false
    lineNumbersInTable = true
    codeFences = true
    guessSyntax = false
  # Levels shown by layouts/partials/toc.html.
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]
