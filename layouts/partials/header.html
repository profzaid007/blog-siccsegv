<header class="header">
  <div class="header-container">
    <div class="logo-section">
      <a href="/" class="logo">
        <i class="fa-solid fa-terminal"></i>
        <span>Siccsegv Blog</span>
      </a>
      <span class="blog-tagline">{{ .Site.Params.tagline }}</span>
    </div>
    <nav class="nav">
      {{ with .OutputFormats.Get "rss" }}
        <a href="{{ .Permalink }}" class="nav-rss" title="RSS Feed" target="_blank">
          <i class="fa-solid fa-rss"></i>
        </a>
      {{ end }}
      <a href="/">All Posts</a>
      <a href="/categories">Categories</a>
      <a href="/archive">Archive</a>
      <a href="{{ .Site.Params.mainSite }}" class="nav-cta">← Main Site</a>
    </nav>
    {{ partial "mobile-menu.html" . }}
  </div>
</header>
