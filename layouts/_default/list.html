{{ define "main" }}
<section class="hero">
  <div class="container">
    <div class="hero-content">
      <h1 class="hero-title">{{ .Title }}<span class="cursor">_</span></h1>
      <p class="hero-subtitle">
        {{ .Content }}
      </p>
    </div>
  </div>
</section>

<section class="posts-section">
  <div class="container">
    <div class="posts-grid">
      {{ range .Pages }}
        {{ partial "post-card.html" . }}
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
